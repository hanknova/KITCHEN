name: Build NovaPlay Release APK (Secure Keystore)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Public Repo
      uses: actions/checkout@v4

    - name: Clone Private Source Code Securely
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        PRIVATE_URL: ${{ secrets.PRIVATE_REPO_URL }}
      run: |
        # Inyectar el Token Personal en la URL del repositorio privado
        authenticated_url=$(echo "$PRIVATE_URL" | sed "s#https://#https://${GH_PAT}@#")
        git clone "$authenticated_url" private_source
        
        # Copiar los archivos del repo privado al directorio actual del runner
        rsync -av --exclude='.git' private_source/ .
        rm -rf private_source

    - name: Decode Keystore and Prepare Paths
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # Crear la ruta /C/ esperada por Gradle en Linux y decodificar el keystore
        sudo mkdir -p /C/
        echo "$KEYSTORE_BASE64" | base64 --decode | sudo tee /C/debug.keystore > /dev/null
        
        # Simular la unidad C/ en la raíz y en el módulo novaplay
        mkdir -p C/ novaplay/C/
        sudo cp /C/debug.keystore C/debug.keystore
        sudo cp /C/debug.keystore novaplay/C/debug.keystore

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build NovaPlay Release APK Only
      run: ./gradlew :novaplay:assembleRelease

    - name: Rename to novaplaybeta.apk
      run: |
        cp novaplay/build/outputs/apk/release/novaplay-release.apk novaplaybeta.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: novaplaybeta
        path: novaplaybeta.apk
