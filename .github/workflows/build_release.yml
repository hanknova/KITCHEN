name: Build and Push NovaPlay Beta APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Public Repo
      uses: actions/checkout@v4

    - name: Clone Private Source Code Securely
      env:
        GH_PAT: ${{ secrets.GH_PAT }}
        PRIVATE_URL: ${{ secrets.PRIVATE_REPO_URL }}
      run: |
        # Inyectar el Token Personal en la URL del repositorio privado
        authenticated_url=$(echo "$PRIVATE_URL" | sed "s#https://#https://${GH_PAT}@#")
        git clone "$authenticated_url" private_source
        
        # Copiar los archivos del repo privado al directorio actual del runner (KITCHEN)
        rsync -av --exclude='.git' private_source/ .
        rm -rf private_source

    - name: Decode Keystore to Project Root
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # Decodificar el keystore directamente en la raíz del proyecto para compatibilidad multiplataforma
        echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build NovaPlay Release APK Only
      run: ./gradlew :novaplay:assembleRelease

    - name: Commit and Push APK to KITCHEN
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "KITCHEN Build Bot"
        
        mkdir -p apks
        cp novaplay/build/outputs/apk/release/novaplay-release.apk apks/novaplaybeta.apk
        
        git add apks/novaplaybeta.apk
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build: Update novaplaybeta.apk [skip ci]" && git push)
